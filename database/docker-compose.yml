version: '3.8'
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: enterprise_vector_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: enterprise_security
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
